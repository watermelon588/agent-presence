<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src file: data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Agent Peeps · control room</title>
<style>
  :root { --bg: #0a0b0d; --panel: #111317; --panel2: #161a1f; --line: #1e2228; --line2: #2a3038; --text: #e7e9ec; --muted: #8a919b; --dim: #5d646e;
    --accent: #8ab4ff; --ok: #3ddc97; --warn: #f5b84b; --bad: #ff6b6b;
    --sans: "Segoe UI Variable Text", "Segoe UI", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    --mono: ui-monospace, "Cascadia Code", "SF Mono", Consolas, monospace; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 450 13px/1.45 var(--sans); }
  body { display: grid; grid-template-columns: 228px 1fr; grid-template-rows: 40px 1fr; overflow: hidden; }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  ::-webkit-scrollbar { width: 10px; } ::-webkit-scrollbar-thumb { background: var(--line2); border-radius: 10px; border: 3px solid var(--bg); }
  kbd { font: 600 10.5px var(--mono); color: var(--muted); border: 1px solid var(--line2); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; background: var(--panel2); }
  code { font: 500 12px var(--mono); color: var(--text); background: var(--panel2); border: 1px solid var(--line); padding: 1px 5px; border-radius: 5px; }

  /* title bar (the window's own bar is hidden; buttons sit over the right edge on Windows/Linux) */
  .brand, .top { -webkit-app-region: drag; display: flex; align-items: center; border-bottom: 1px solid var(--line); }
  .brand { gap: 9px; padding: 0 14px; background: var(--bg); border-right: 1px solid var(--line); font: 600 12.5px var(--mono); }
  .mac .brand { padding-left: 82px; }
  .brand img { width: 28px; height: 28px; margin: -4px -3px; object-fit: contain; }
  .brand span { color: var(--dim); font-weight: 500; }
  .top { gap: 12px; padding: 0 150px 0 18px; font: 500 12px var(--mono); color: var(--muted); }
  .mac .top { padding-right: 18px; }
  .top b { color: var(--text); font-weight: 600; }
  .top .live { margin-left: auto; display: flex; align-items: center; gap: 7px; }
  .top .live i, .pulse { width: 7px; height: 7px; border-radius: 50%; background: var(--dim); display: inline-block; }
  .top .live.on i, .pulse.on { background: var(--ok); box-shadow: 0 0 0 0 rgba(61,220,151,.6); animation: ping 1.8s ease-out infinite; }
  .top .vis { -webkit-app-region: no-drag; }

  /* sidebar */
  nav { grid-row: 2; overflow: auto; padding: 10px 8px 16px; border-right: 1px solid var(--line); background: var(--bg); }
  nav h3 { margin: 16px 10px 6px; font: 600 10.5px var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--dim); }
  nav button { width: 100%; display: flex; align-items: center; gap: 10px; border: 0; background: none; padding: 6px 10px; border-radius: 8px; text-align: left; color: var(--muted); }
  nav button:hover { background: var(--panel); color: var(--text); }
  nav button[aria-current="true"] { background: var(--panel2); color: var(--text); box-shadow: inset 2px 0 0 var(--accent); }
  nav button svg { flex: none; width: 16px; height: 16px; }
  nav button kbd { margin-left: auto; }
  nav button .badge { margin-left: auto; min-width: 18px; padding: 0 5px; border-radius: 9px; background: var(--bad); color: #fff; font: 700 10px/16px var(--mono); text-align: center; }
  nav .th { position: relative; flex: none; width: 26px; height: 26px; display: grid; place-items: center; }
  nav .th img { max-width: 26px; max-height: 26px; object-fit: contain; }
  nav .th.unset img { opacity: .45; filter: grayscale(.4); }
  nav .th .count { position: absolute; right: -5px; bottom: -4px; background: var(--accent); color: #0a0b0d; font: 700 9px/13px var(--mono); border-radius: 7px; padding: 0 4px; }
  nav .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .logo-chip { background: #fff; border-radius: 50%; padding: 4px; }
  nav form { display: flex; gap: 4px; padding: 4px 6px; }
  nav input { min-width: 0; flex: 1; border: 1px solid var(--line2); border-radius: 7px; padding: 5px 8px; background: var(--panel); font: 500 12px var(--mono); }
  nav input:focus { outline: none; border-color: var(--accent); }
  nav form button { width: auto; padding: 4px 9px; border: 1px solid var(--line2); background: var(--panel); color: var(--text); }

  main { grid-row: 2; overflow: auto; padding: 22px 26px 40px; }
  h1 { font-size: 18px; font-weight: 650; margin: 0 0 3px; letter-spacing: -.01em; }
  .sub { color: var(--muted); margin: 0 0 18px; }
  h2 { display: flex; align-items: center; gap: 10px; margin: 26px 0 10px; font: 600 10.5px var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--dim); }
  h2 .use { text-transform: none; letter-spacing: 0; font: 600 11.5px var(--sans); color: var(--text); border: 1px solid var(--line2); background: var(--panel); border-radius: 7px; padding: 3px 9px; }
  h2 .use[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }

  /* overview */
  .stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .stat { background: var(--panel); padding: 12px 14px; }
  .stat b { display: block; font: 600 22px/1.1 var(--mono); letter-spacing: -.02em; }
  .stat span { font: 500 11px var(--mono); color: var(--muted); }
  .stat.alert b { color: var(--bad); }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 12px; }
  .card { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; transition: border-color .2s; }
  .card.waiting { border-color: color-mix(in srgb, var(--bad) 60%, transparent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--bad) 12%, transparent); }
  .card.rest { opacity: .62; }
  .card .hd { display: flex; gap: 12px; align-items: center; }
  .av { position: relative; flex: none; width: 46px; height: 46px; display: grid; place-items: center; }
  .av > img { max-width: 46px; max-height: 46px; object-fit: contain; }
  .av > img.logo-chip { width: 40px; height: 40px; padding: 8px; }
  .av .mark { position: absolute; right: -4px; bottom: -4px; width: 18px; height: 18px; padding: 2.5px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 2px var(--panel); }
  .card .nm { font-weight: 650; }
  .card .nm small { margin-left: 6px; font: 500 11px var(--mono); color: var(--muted); background: var(--panel2); border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; }
  .card .cwd { font: 500 11.5px var(--mono); color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .state { display: flex; align-items: center; gap: 8px; margin-top: 12px; padding: 8px 10px; border-radius: 8px; background: var(--bg); border: 1px solid var(--line); font: 500 12px var(--mono); overflow: hidden; white-space: nowrap; }
  .state b { font-weight: 600; color: var(--sc, var(--text)); }
  .state span { color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
  .dot { flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--sc, var(--dim)); }
  .busy .dot { animation: blink 1.2s ease-in-out infinite; }
  .helpers { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; padding-left: 12px; border-left: 2px solid var(--agent); }
  .helper { display: flex; align-items: center; gap: 7px; font: 500 11.5px var(--mono); color: var(--muted); white-space: nowrap; overflow: hidden; }
  .helper img { width: 18px; height: 18px; object-fit: contain; flex: none; }
  .helper img.logo-chip { padding: 2px; }
  .helper b { color: var(--text); font-weight: 600; }
  .card .ft { display: flex; align-items: center; gap: 6px; margin-top: 12px; font: 500 11px var(--mono); color: var(--dim); }
  .card .ft button { border: 1px solid var(--line2); background: none; color: var(--muted); border-radius: 6px; padding: 2px 8px; font: 500 11px var(--sans); }
  .card .ft button:first-of-type { margin-left: auto; }
  .card .ft button:hover { color: var(--text); border-color: var(--muted); }
  .empty { display: flex; align-items: center; gap: 16px; padding: 22px; border: 1px dashed var(--line2); border-radius: 12px; color: var(--muted); }
  .empty .pile { display: flex; } .empty .pile img { width: 40px; height: 40px; object-fit: contain; margin-right: -8px; }
  .log { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); font: 500 11.5px/1.5 var(--mono); max-height: 340px; overflow: auto; }
  .log div { display: grid; grid-template-columns: 70px 18px 130px 92px 1fr; gap: 8px; align-items: center; padding: 5px 12px; border-top: 1px solid var(--line); white-space: nowrap; }
  .log div:first-child { border-top: 0; }
  .log div.new { animation: flash 1s ease-out; }
  .log time { color: var(--dim); }
  .log img { width: 14px; height: 14px; border-radius: 50%; background: #fff; padding: 1.5px; }
  .log .who { color: var(--text); overflow: hidden; text-overflow: ellipsis; }
  .log .st { color: var(--sc, var(--muted)); }
  .log .x { color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
  .s-thinking { --sc: #a78bfa; } .s-reading { --sc: #60a5fa; } .s-writing { --sc: #f5b84b; } .s-running { --sc: #3ddc97; } .s-delegating { --sc: #f472b6; }
  .s-browsing { --sc: #38bdf8; } .s-working { --sc: #fbbf24; } .s-waiting { --sc: #ff6b6b; } .s-done { --sc: #22c55e; } .s-idle, .s-gone { --sc: #6b7280; }

  /* settings */
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
  .row { display: grid; grid-template-columns: 220px 1fr; align-items: center; gap: 16px; padding: 13px 16px; border-top: 1px solid var(--line); }
  .row:first-child { border-top: 0; }
  .row > :last-child { justify-self: start; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .row .t { font-weight: 550; }
  .row .t small { display: block; color: var(--muted); font-weight: 400; font-size: 12px; }
  .seg { display: inline-flex; background: var(--bg); border: 1px solid var(--line2); border-radius: 9px; padding: 2px; gap: 2px; }
  .seg button { border: 0; background: none; padding: 5px 11px; border-radius: 7px; color: var(--muted); }
  .seg button:hover { color: var(--text); }
  .seg button[aria-pressed="true"] { background: var(--panel2); color: var(--text); box-shadow: 0 0 0 1px var(--line2); font-weight: 600; }
  .sw { appearance: none; width: 34px; height: 20px; border-radius: 10px; background: var(--line2); position: relative; cursor: pointer; margin: 0; transition: background .15s; flex: none; }
  .sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: transform .15s; }
  .sw:checked { background: var(--accent); } .sw:checked::after { transform: translateX(14px); }
  .ck { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line2); background: var(--bg); border-radius: 8px; padding: 4px 10px 4px 5px; color: var(--muted); }
  .chip img { width: 18px; height: 18px; padding: 2px; border-radius: 50%; background: #fff; }
  .chip[aria-pressed="true"] { color: var(--text); border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--bg)); }
  .chip[aria-pressed="false"] img { filter: grayscale(1); opacity: .5; }
  .btn { border: 1px solid var(--line2); background: var(--panel2); padding: 6px 12px; border-radius: 8px; color: var(--text); }
  .btn:hover { border-color: var(--muted); }
  input[type=range] { accent-color: var(--accent); width: 180px; }
  .val { font: 500 12px var(--mono); color: var(--muted); min-width: 40px; }
  .keyhint { font: 500 11px var(--mono); color: var(--dim); }
  .note { color: var(--dim); font-size: 12px; margin-top: 16px; }
  .row.apps > :last-child { flex-direction: column; align-items: flex-start; gap: 10px; }
  .front { font: 500 12px var(--mono); color: var(--muted); } .front b { color: var(--text); } .front .yes { color: var(--ok); } .front .no { color: var(--warn); } .front.bad { color: var(--warn); }
  .chip.app { padding: 4px 10px; font: 500 12px var(--mono); }
  .chip.app.seen:not([aria-pressed="true"]) { border-style: dashed; }
  .add { display: flex; gap: 6px; } .add input { width: 200px; border: 1px solid var(--line2); border-radius: 8px; padding: 5px 9px; background: var(--bg); font: 500 12px var(--mono); }
  .add input:focus { outline: none; border-color: var(--accent); }

  /* bubble preview: two desktops, the same bubble as the overlay */
  .stage { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; margin-bottom: 14px; }
  .desk { position: relative; height: 170px; display: flex; align-items: flex-end; justify-content: flex-end; padding: 16px 26px; }
  .desk.dark { background: radial-gradient(120% 90% at 20% 0%, #26304a, #0d1018 70%); }
  .desk.light { background: radial-gradient(120% 90% at 20% 0%, #fff, #dde3ec 75%); }
  .desk > small { position: absolute; left: 12px; top: 10px; font: 600 10px var(--mono); text-transform: uppercase; letter-spacing: .08em; color: #8892a6; }
  .pv { position: relative; display: flex; flex-direction: column; align-items: flex-end; --bfs: 12px; font-size: var(--bfs); }
  .pv.bs-small { --bfs: 11px; } .pv.bs-large { --bfs: 13.5px; }
  .pv.th-l { --bb: rgba(255,255,255,.97); --bt: #0b0b0c; --bl: rgba(0,0,0,.14); --bsh: 0 0 2px #fff, 0 0 7px rgba(255,255,255,.95); }
  .pv.th-d { --bb: rgba(17,18,22,.95); --bt: #f5f5f6; --bl: rgba(255,255,255,.16); --bsh: 0 1px 2px rgba(0,0,0,.9), 0 0 7px rgba(0,0,0,.65); }
  .pv .bub { position: relative; margin-bottom: 9px; min-width: 150px; padding: 7px 10px 8px; border-radius: 11px; color: var(--bt); background: var(--bb); border: 1px solid var(--bl);
    box-shadow: 0 6px 20px rgba(0,0,0,.18); white-space: nowrap; --bm: color-mix(in srgb, var(--bt) 62%, transparent); line-height: 1.35; }
  .pv .bub::after { content: ""; position: absolute; bottom: -5px; right: 21px; width: 8px; height: 8px; background: var(--bb); border-right: 1px solid var(--bl); border-bottom: 1px solid var(--bl); transform: rotate(45deg); }
  .pv.noborder .bub, .pv.noborder .bub::after { border-color: transparent; }
  .pv.text .bub { background: none; border-color: transparent; box-shadow: none; padding: 0; text-shadow: var(--bsh); }
  .pv.text .bub::after { display: none; }
  .pv.off .bub { visibility: hidden; }
  .pv .bub .h { display: flex; gap: 6px; align-items: baseline; } .pv .bub .h b { font-weight: 700; } .pv .bub .h span { color: var(--bm); font-size: .9em; }
  .pv .bub .w { display: flex; align-items: center; gap: 6px; margin-top: 3px; } .pv .bub .w i { width: 7px; height: 7px; border-radius: 50%; background: #f59e0b; }
  .pv .bub .w code { all: unset; font: 500 .92em var(--mono); color: var(--bm); }
  .pv .bub .s { margin-top: 5px; font: 500 .82em var(--mono); color: var(--bm); }
  .pv.nostats .bub .s { display: none; }
  .pv > img { width: 56px; height: 56px; object-fit: contain; filter: drop-shadow(0 3px 4px rgba(0,0,0,.3)); }
  .swatches { display: flex; gap: 6px; align-items: center; }
  .swatch { width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--line2); padding: 0; background: var(--c); }
  .swatch.auto { background: linear-gradient(135deg, #fff 50%, #0b0b0c 50%); }
  .swatch[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent); }
  input[type=color] { width: 28px; height: 26px; border: 1px solid var(--line2); border-radius: 7px; background: var(--panel2); padding: 2px; cursor: pointer; }

  /* shortcuts */
  .keys { display: grid; grid-template-columns: 1fr; }
  .key { display: grid; grid-template-columns: 210px 1fr auto; gap: 14px; align-items: center; padding: 10px 16px; border-top: 1px solid var(--line); }
  .key:first-child { border-top: 0; }
  .key .combo { display: flex; gap: 4px; }
  .key .combo kbd { font-size: 11.5px; padding: 1px 7px; color: var(--text); }
  .key .ok { font: 500 11px var(--mono); color: var(--ok); } .key .taken { font: 500 11px var(--mono); color: var(--warn); } .key .offk { font: 500 11px var(--mono); color: var(--dim); }

  /* sticker picker */
  .bar { position: sticky; top: -22px; margin: -22px -26px 0; padding: 22px 26px 14px; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); z-index: 1; }
  .chosen { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; min-height: 64px; }
  .chosen .pick { position: relative; width: 60px; height: 60px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line2); display: grid; place-items: center; }
  .chosen .pick img { width: 46px; height: 46px; object-fit: contain; }
  .chosen .pick button { position: absolute; top: -6px; right: -6px; width: 18px; height: 18px; border-radius: 50%; border: 0; background: var(--text); color: var(--bg); font-size: 11px; line-height: 18px; padding: 0; }
  .chosen .pick.pack { width: auto; padding: 0 12px 0 6px; display: flex; gap: 8px; }
  .chosen .pick.pack img { width: 40px; height: 40px; }
  .chosen .pick.pack b { font-size: 12px; } .chosen .pick.pack small { display: block; color: var(--muted); font-size: 11px; }
  .chosen .def { display: flex; align-items: center; gap: 12px; color: var(--muted); }
  .chosen .def img { width: 44px; height: 44px; object-fit: contain; }
  .chosen .def img.logo-chip { padding: 8px; }
  .actions { display: flex; gap: 8px; margin-top: 12px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 8px; }
  .tile { position: relative; border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 8px 4px 6px; display: flex; flex-direction: column; align-items: center; gap: 3px; transition: transform .12s, border-color .12s; }
  .tile:hover { border-color: var(--line2); transform: translateY(-2px); }
  .tile[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 9%, var(--panel)); }
  .tile[aria-pressed="true"]::after { content: attr(data-n); position: absolute; top: 4px; right: 4px; min-width: 16px; height: 16px; border-radius: 8px; background: var(--accent); color: var(--bg); font: 700 10px/16px var(--mono); }
  .tile img { width: 54px; height: 54px; object-fit: contain; }
  .tile span { font-size: 10.5px; color: var(--muted); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mt { margin-top: 14px; }

  @keyframes ping { to { box-shadow: 0 0 0 7px rgba(61,220,151,0); } }
  @keyframes blink { 50% { opacity: .3; } }
  @keyframes flash { from { background: color-mix(in srgb, var(--accent) 12%, transparent); } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="brand"><img src="../logo.png" alt=""> agentpeeps <span>control room</span></div>
<div class="top" id="top"></div>
<nav id="nav"></nav>
<main id="main"></main>
<script>
  let d = null, tab = 'overview';
  const extra = []; // model rules added here that have no stickers yet
  const live = new Map(), log = []; // sessions seen in the event stream, newest events first
  const TOOL = new Set(['reading', 'writing', 'running', 'delegating', 'browsing', 'working']);
  const REST = new Set(['done', 'idle']);
  const VERB = { thinking: 'thinking', reading: 'reading', writing: 'writing', running: 'running', delegating: 'handing off', browsing: 'browsing', working: 'working', waiting: 'needs you', done: 'done', idle: 'idle', gone: 'ended' };
  const NAMES = { claude: 'Claude Code', codex: 'Codex', copilot: 'Copilot', antigravity: 'Antigravity' };
  const STALE = 15 * 60e3;
  const h = (tag, props = {}, ...kids) => { const el = Object.assign(document.createElement(tag), props); el.append(...kids.flat().filter(k => k != null && k !== false)); return el; };
  const img = (src, cls) => h('img', { src, alt: '', className: cls || '', loading: 'lazy', decoding: 'async' });
  const logo = a => NAMES[a] ? 'agents/' + a + '.svg' : null;
  const hash = s => [...String(s)].reduce((x, c) => (x * 31 + c.charCodeAt(0)) >>> 0, 7);
  const base = p => String(p).split(/[\\/]/).filter(Boolean).pop() || String(p);
  const plural = (n, w) => n + ' ' + w + (n === 1 ? '' : 's');
  const dur = ms => { const s = Math.max(0, Math.round(ms / 1000)); return s < 60 ? s + 's' : s < 3600 ? Math.floor(s / 60) + 'm ' + (s % 60) + 's' : Math.floor(s / 3600) + 'h ' + Math.floor(s / 60) % 60 + 'm'; };
  const what = e => e.state === 'waiting' ? (e.detail && e.detail !== 'needs you' ? e.detail : '') : REST.has(e.state) ? '' : e.state === 'running' || e.state === 'browsing' || e.state === 'delegating' ? e.detail || (e.file ? base(e.file) : '') : e.file ? base(e.file) : e.detail || '';
  const MODK = () => d && d.mac ? ['⌘', '⌥', '⇧'] : ['Ctrl', 'Alt', 'Shift'];
  const ICONS = {
    overview: '<path d="M3 12h4l3-8 4 16 3-8h4"/>',

      const use = id ? h('button', { className: 'use', textContent: on ? '✓ Using whole pack' : 'Use whole pack', onclick: () => pick(on ? chosen.filter(x => x !== id) : [...chosen, id]) }) : null;
      if (use) use.setAttribute('aria-pressed', String(!!on));
      return [h('h2', {}, g.group, use), h('div', { className: 'grid' }, g.items.map(i => {
        const n = chosen.indexOf(i.file);
        const b = h('button', { className: 'tile', title: i.name, onclick: () => pick(n >= 0 ? chosen.filter(f => f !== i.file) : [...chosen, i.file]) }, img(i.url), h('span', { textContent: i.name }));
        b.setAttribute('aria-pressed', String(n >= 0)); b.dataset.n = n + 1;
        return b;
      }))]; });
    return [bar, ...(blocks.length ? blocks : [h('p', { className: 'empty', innerHTML: 'No stickers yet. Put images in <code>~/.agent-presence/stickers</code> (subfolders become groups), or add them from your computer.' })])];
  }

  const PAGES = { overview, display, bubbles, shortcuts };
  function render() {
    nav(); topbar();
    const t = d.targets.find(x => x.key === tab) || extra.find(x => x.key === tab);
    if (!t && !PAGES[tab]) tab = 'overview';
    const main = document.getElementById('main'), y = main.scrollTop;
    main.replaceChildren(...(t ? stickers(t) : d.keys ? PAGES[tab]() : stale()));
    main.scrollTop = y;
  }
  // Updated on disk while an older Agent Peeps keeps running: this page is new, the data it gets is old.
  const stale = () => [h('h1', { textContent: 'Restart Agent Peeps to finish updating' }),
    h('p', { className: 'sub', textContent: 'A newer version is installed, but the copy that is running started before it. Quit it (tray icon → Quit Agent Peeps, or the first command), then start it again:' }),
    h('p', {}, h('code', { textContent: 'agentpeeps overlay --quit' })), h('p', {}, h('code', { textContent: 'agentpeeps overlay' })),
    h('p', { className: 'note', textContent: 'Sticker choices on the left still work until then.' })];
  function go(k) { tab = k; render(); document.getElementById('main').scrollTop = 0; }

  addEventListener('keydown', ev => {
    if (ev.target.closest && ev.target.closest('input') && ev.key !== 'Escape') return;
    if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'w') { ev.preventDefault(); window.close(); return; }
    if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
    const i = '1234'.indexOf(ev.key);
    if (i >= 0) go(VIEWS[i][0]);
    else if (ev.key === '?') go('shortcuts');
    else if (ev.key === 'Escape') { document.activeElement.blur(); go('overview'); }
    else if (ev.key === '/') { ev.preventDefault(); document.querySelector('nav input').focus(); }
  });
  setInterval(() => { if (tab === 'overview' && !document.hidden && live.size) soon(); }, 1000); // timers tick

  ap.onRoom(data => { d = data; document.body.classList.toggle('mac', !!data.mac); if (data.tab) tab = data.tab === 'settings' ? 'display' : data.tab; render(); });
  ap.onEvent(track);
  ap.onFront(f => { if (!d) return; d.front = f; if (tab === 'display' && !document.activeElement.closest('form')) render(); });
</script>
</body>
</html>
