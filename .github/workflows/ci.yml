name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [18, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ matrix.node }}' }
      # cli.js and the tests need no dependencies (Electron is only fetched for the overlay)
      - run: node test.js
      - run: node cli.js show --once
      - run: npm pack --dry-run

  website:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: website/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: website/web/package-lock.json }
      - run: npm ci
      - run: npm run build
